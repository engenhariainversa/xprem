name: Deploy (self-hosted)

# Deploy de ota.engenhariainversa.com.br: o runner do servidor atualiza o clone
# de produção e reconstrói a stack de docker-compose.prod.yml. Os segredos ficam
# em .env.prod no servidor, nunca no GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, jarvis-xprem]
    timeout-minutes: 30
    env:
      DEPLOY_DIR: /mnt/hd2tb/projetos/xprem
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.prod
    steps:
      - name: Atualizar codigo no diretorio de producao
        run: |
          cd "$DEPLOY_DIR"
          git fetch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main
          git checkout -q main
          git merge --ff-only FETCH_HEAD
          git log --oneline -1

      - name: Build e subir containers
        run: |
          cd "$DEPLOY_DIR"
          $COMPOSE build --build-arg VERSION=fork-$(git rev-parse --short HEAD) app
          $COMPOSE up -d --remove-orphans

      - name: Health check
        run: |
          cd "$DEPLOY_DIR"
          for i in $(seq 1 60); do
            if $COMPOSE exec -T app wget -qO- http://localhost:3000/ready >/dev/null 2>&1; then
              echo "xprem respondendo"; exit 0
            fi
            sleep 2
          done
          echo "xprem nao respondeu em 120s"; $COMPOSE logs --tail=80 app; exit 1

      - name: Limpar imagens antigas
        if: success()
        run: docker image prune -f
